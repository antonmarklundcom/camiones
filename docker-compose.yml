# Local dev database only — production MySQL lives on Hostinger.
# Port 3307 on the host so it never collides with propia's local MySQL (3306).
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: camiones
      MYSQL_USER: camiones
      MYSQL_PASSWORD: camiones
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
